<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<body>
<main class="detail">
	<p class="eyebrow">Profile</p>
	<h1 th:text="${user.name}">Name</h1>
	<p class="meta">
		<span th:text="${user.email}">name@example.com</span>
		<span th:text="${user.role}">USER</span>
	</p>
	<form class="form" th:action="@{/logout}" method="post">
		<th:block th:replace="~{fragments :: csrf}"></th:block>
		<button class="button" type="submit">Log out</button>
	</form>
</main>
</body>
</html>
