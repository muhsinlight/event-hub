<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${pageTitle} ?: 'Event Hub'">Event Hub</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
	<header class="top">
		<a class="brand" th:href="@{/}">
			<span class="mark" aria-hidden="true"></span>
			Event Hub
		</a>
		<nav class="nav">
			<a th:href="@{/}">Events</a>
			<a th:if="${account != null}" th:href="@{/orders}">Orders</a>
			<a th:if="${account != null and account.seller()}" th:href="@{/events/new}">New event</a>
			<a th:if="${account != null and account.admin()}" th:href="@{/admin/users}">People</a>
			<a th:if="${account != null}" th:href="@{/tickets}">Tickets</a>
			<a th:if="${account == null}" th:href="@{/login}">Log in</a>
			<a th:if="${account != null}" th:href="@{/profile}" th:text="${account.name()}">Profile</a>
			<a th:if="${account != null and account.admin()}" th:href="@{/swagger-ui/index.html}">Swagger</a>
		</nav>
	</header>
	<div th:replace="${content}">Page</div>
	<footer class="foot">
		<p>Box office for published events.</p>
	</footer>
</body>
</html>
